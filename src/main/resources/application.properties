spring.application.name=FerreSur
server.port=${PORT:8081}

spring.datasource.url=${FERRESUR_DB_URL:jdbc:postgresql://localhost:5432/ferresur}
spring.datasource.username=${FERRESUR_DB_USERNAME:postgres}
spring.datasource.password=${FERRESUR_DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

server.error.whitelabel.enabled=false
