<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='clientes',stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1 th:text="${cliente.id==null?'Nuevo cliente':'Editar cliente'}">Nuevo cliente</h1><p>Datos para ventas y créditos.</p></div><a class="btn ghost" th:href="@{/clientes}">← Volver</a></div><div class="form-card"><form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" class="grid-form"><input type="hidden" th:field="*{id}"><div><label>Nombre completo</label><input th:field="*{nombre}" required></div><div><label>DNI / RUC</label><input th:field="*{documento}"></div><div><label>Teléfono</label><input th:field="*{telefono}"></div><div><label>Correo</label><input type="email" th:field="*{email}"></div><div class="wide"><label>Dirección</label><input th:field="*{direccion}"></div><div><label>Límite de crédito (S/)</label><input type="number" step="0.01" min="0" th:field="*{limiteCredito}"></div><div class="wide form-actions"><a class="btn ghost" th:href="@{/clientes}">Cancelar</a><button class="btn primary">Guardar cliente</button></div></form></div></section></main></div></body></html>
