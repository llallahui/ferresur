<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='clientes',stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1>Clientes</h1><p>Clientes, créditos y saldos pendientes.</p></div><a class="btn primary" th:href="@{/clientes/nuevo}">＋ Nuevo Cliente</a></div><div class="stats four"><div class="stat"><span class="ico orange">♙</span><b th:text="${total}">0</b><label>Clientes</label><small>Activos</small></div><div class="stat"><span class="ico red">$</span><b th:text="${deudores}">0</b><label>Con deuda</label><small>Requieren seguimiento</small></div><div class="stat"><span class="ico red">S/</span><b th:text="'S/ '+${#numbers.formatDecimal(deudaTotal,1,2)}">S/ 0.00</b><label>Deuda total</label><small>Créditos pendientes</small></div></div><div class="table-card"><table><thead><tr><th>CLIENTE</th><th>DOCUMENTO</th><th>TELÉFONO</th><th>LÍMITE</th><th>DEUDA</th><th>ACCIONES</th></tr></thead><tbody><tr th:each="c:${clientes}"><td><b th:text="${c.nombre}">Cliente</b><small th:text="${c.email}">correo</small></td><td th:text="${c.documento ?: '—'}">—</td><td th:text="${c.telefono ?: '—'}">—</td><td th:text="'S/ '+${#numbers.formatDecimal(c.limiteCredito,1,2)}">S/ 0.00</td><td><strong th:text="'S/ '+${#numbers.formatDecimal(deudasPorCliente[c.id],1,2)}">S/ 0.00</strong></td><td class="actions"><a class="btn ghost" th:href="@{/clientes/{id}(id=${c.id})}">Ver</a><a class="btn ghost" th:href="@{/clientes/editar/{id}(id=${c.id})}">Editar</a></td></tr><tr th:if="${#lists.isEmpty(clientes)}"><td colspan="6"><div class="empty">No hay clientes registrados.</div></td></tr></tbody></table></div></section></main></div></body></html>
