<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='clientes',stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1 th:text="${cliente.nombre}">Cliente</h1><p th:text="${cliente.documento ?: 'Sin documento'} + ' · ' + ${cliente.telefono ?: 'Sin teléfono'}">Documento</p></div><a class="btn ghost" th:href="@{/clientes}">← Clientes</a></div><div class="stats four"><div class="stat"><b th:text="'S/ '+${#numbers.formatDecimal(deudaTotal,1,2)}">S/ 0.00</b><label>Deuda pendiente</label><small>Saldo actual</small></div><div class="stat"><b th:text="'S/ '+${#numbers.formatDecimal(cliente.limiteCredito,1,2)}">S/ 0.00</b><label>Límite de crédito</label><small>Configurado</small></div></div><div class="table-card"><table><thead><tr><th>VENTA</th><th>FECHA DE CRÉDITO</th><th>VENCIMIENTO</th><th>TOTAL</th><th>SALDO</th><th>ABONO</th></tr></thead><tbody><tr th:each="v:${deudas}"><td th:text="'#'+${v.numero}">#0001</td><td th:text="${#temporals.format(v.fecha,'dd/MM/yyyy')}">30/09/2026</td><td th:text="${v.fechaVencimientoCredito != null ? #temporals.format(v.fechaVencimientoCredito,'dd/MM/yyyy') : '—'}">—</td><td th:text="'S/ '+${#numbers.formatDecimal(v.total,1,2)}">S/ 0.00</td><td><strong th:text="'S/ '+${#numbers.formatDecimal(v.saldoPendiente,1,2)}">S/ 0.00</strong></td><td><form th:action="@{/clientes/deuda/{id}/abono(id=${v.id})}" method="post" class="inline-form"><input type="number" step="0.01" min="0.01" th:max="${v.saldoPendiente}" name="monto" placeholder="Monto" required><button class="btn primary">Abonar</button></form></td></tr><tr th:if="${#lists.isEmpty(deudas)}"><td colspan="6"><div class="empty">Este cliente no tiene deudas pendientes.</div></td></tr></tbody></table></div></section></main></div></body></html>
