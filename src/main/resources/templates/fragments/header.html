<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<header th:fragment="topbar" class="topbar"><button class="mobile-menu global-menu" type="button" data-sidebar-toggle aria-label="Abrir o cerrar menú">☰</button><div class="mobile-brand"><div><strong>Ferretería FerreSur</strong><span>Huamanga, Ayacucho - 2026</span></div></div><div class="top-actions"><a class="notification" th:href="@{/dashboard}" title="Notificaciones">🔔<b th:if="${notificaciones>0}" th:text="${notificaciones}">2</b></a><a class="avatar-link" th:href="@{/perfil}"><div class="avatar" th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</div></a></div></header>
<aside th:fragment="sidebar" class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">🔧</div><div><strong>FerreSur</strong><small>Sistema de Gestión</small></div></div><div class="menu-title">MENÚ PRINCIPAL</div><nav>
<a th:href="@{/dashboard}" th:classappend="${active=='dashboard'}?' active':''"><span>▦</span><em-text>Dashboard</em-text><i>›</i></a>
<a th:href="@{/productos}" th:classappend="${active=='productos'}?' active':''"><span>⬡</span><em-text>Productos</em-text><em class="count" th:if="${stockBajoCount>0}" th:text="${stockBajoCount}">2</em><i>›</i></a>
<a th:href="@{/ventas}" th:classappend="${active=='ventas'}?' active':''"><span>🛒</span><em-text>Ventas</em-text><i>›</i></a>
<a th:href="@{/clientes}" th:classappend="${active=='clientes'}?' active':''"><span>♙</span><em-text>Clientes</em-text><i>›</i></a>
<a th:href="@{/caja}" th:classappend="${active=='caja'}?' active':''"><span>▣</span><em-text>Caja</em-text><i>›</i></a>
<a sec:authorize="hasRole('ADMIN')" th:href="@{/reportes}" th:classappend="${active=='reportes'}?' active':''"><span>▥</span><em-text>Reportes</em-text><i>›</i></a>
<a sec:authorize="hasRole('ADMIN')" th:href="@{/sueldos}" th:classappend="${active=='sueldos'}?' active':''"><span>♙</span><em-text>Sueldos</em-text><em class="count" th:if="${pagosPendientes>0}" th:text="${pagosPendientes}">1</em><i>›</i></a>
<a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}" th:classappend="${active=='usuarios'}?' active':''"><span>♙</span><em-text>Usuarios</em-text><i>›</i></a></nav><div class="sidebar-user"><a class="mini-avatar" th:href="@{/perfil}" th:text="${#authentication.name.substring(0,1).toUpperCase()}">A</a><div class="sidebar-user-info"><b th:text="${#authentication.name}">admin</b><small sec:authorize="hasRole('ADMIN')">Administrador</small><small sec:authorize="hasRole('VENDEDOR')">Vendedor</small></div><form th:action="@{/logout}" method="post"><button type="submit" title="Cerrar sesión">↪</button></form></div></aside></body></html>
