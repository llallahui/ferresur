<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sueldos · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='sueldos',stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1>Sueldos de vendedores</h1><p>Programación, vencimientos y pagos realizados.</p></div></div><div class="stats"><div class="stat"><b th:text="${pendientes}">0</b><label>Pagos pendientes</label><small>Requieren atención</small></div></div><div class="form-card"><form method="post" th:action="@{/sueldos/guardar}" class="grid-form"><div><label>Vendedor</label><select name="vendedorId" required><option value="">Seleccionar</option><option th:each="v:${vendedores}" th:value="${v.id}" th:text="${v.nombreCompleto}">Vendedor</option></select></div><div><label>Monto (S/)</label><input name="monto" type="number" step="0.01" min="0.01" required></div><div><label>Fecha de pago</label><input name="fechaProgramada" type="date" th:value="${hoy}" required></div><div><label>Observación</label><input name="observacion"></div><div class="wide form-actions"><button class="btn primary">Programar pago</button></div></form></div><div class="table-card"><table><thead><tr><th>VENDEDOR</th><th>FECHA PROGRAMADA</th><th>MONTO</th><th>ESTADO</th><th>FECHA PAGO</th><th>ACCIÓN</th></tr></thead><tbody><tr th:each="p:${pagos}"><td th:text="${p.vendedor.nombreCompleto}">Vendedor</td><td th:text="${p.fechaProgramada}">2026-09-30</td><td th:text="'S/ '+${#numbers.formatDecimal(p.monto,1,2)}">S/ 0.00</td><td><span class="status" th:classappend="${p.estado.name()=='PENDIENTE'}?' danger':''" th:text="${p.estado.name()=='PENDIENTE'?'Pendiente':'Pagado'}">Pendiente</span></td><td th:text="${p.fechaPago ?: '—'}">—</td><td><form th:if="${p.estado.name()=='PENDIENTE'}" method="post" th:action="@{/sueldos/{id}/pagar(id=${p.id})}"><button class="btn success-btn">Marcar pagado</button></form></td></tr><tr th:if="${#lists.isEmpty(pagos)}"><td colspan="6"><div class="empty">No hay pagos programados.</div></td></tr></tbody></table></div></section></main></div></body></html>
