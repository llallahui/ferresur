<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuario · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='usuarios',stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1 th:text="${edicion ? 'Editar usuario' : 'Nuevo usuario'}">Nuevo usuario</h1><p th:text="${edicion ? 'Los cambios de contraseña se realizan desde Mi perfil.' : 'Crea un usuario y asigna su rol.'}">Crea un usuario.</p></div><a class="btn ghost" th:href="@{/usuarios}">← Volver</a></div><div class="form-card"><form id="userForm" th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="grid-form"><input type="hidden" th:field="*{id}"><div><label>Nombre completo</label><input th:field="*{nombreCompleto}" required><div class="field-error" th:errors="*{nombreCompleto}"></div></div><div><label>Nombre de usuario</label><input th:field="*{username}" required><div class="field-error" th:errors="*{username}"></div></div><div><label>Rol</label><select th:field="*{rol}" required><option value="">Seleccionar rol</option><option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.nombre}">Vendedor</option></select><div class="field-error" th:errors="*{rol}"></div></div><div th:if="${!edicion}"><label>Contraseña</label><div class="password-input"><input id="userPassword" type="password" th:field="*{password}" required minlength="6"><button type="button" data-toggle-password="userPassword">👁</button></div><div class="field-error" th:errors="*{password}"></div></div><div th:if="${!edicion}"><label>Confirmar contraseña</label><div class="password-input"><input id="userPasswordConfirm" type="password" th:field="*{passwordConfirm}" required minlength="6"><button type="button" data-toggle-password="userPasswordConfirm">👁</button></div><div id="userPasswordMatch" class="field-error" th:errors="*{passwordConfirm}"></div></div><div class="wide alert ok" th:if="${edicion}">🔒 La contraseña no puede ser modificada por otro administrador. El usuario debe cambiarla desde <a th:href="@{/perfil}">Mi perfil</a>.</div><div class="wide form-actions"><a class="btn ghost" th:href="@{/usuarios}">Cancelar</a><button class="btn primary" type="submit" th:text="${edicion ? 'Guardar cambios' : 'Crear usuario'}">Crear usuario</button></div></form></div></section></main></div><script th:src="@{/js/app.js}"></script></body></html>
