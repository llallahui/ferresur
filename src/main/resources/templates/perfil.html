<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='perfil',stockBajoCount=0"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=0"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1>Mi perfil</h1><p>Datos de tu cuenta y cambio seguro de contraseña.</p></div></div><div class="form-card"><h3 th:text="${usuario.nombreCompleto}">Usuario</h3><p class="muted-note" th:text="'@'+${usuario.username}+' · '+${usuario.rol.nombre}">@admin · Administrador</p><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="alert ok" th:if="${ok}" th:text="${ok}"></div><form th:action="@{/perfil/password}" method="post" class="grid-form"><div><label>Contraseña actual</label><input name="actual" type="password" required></div><div><label>Nueva contraseña</label><input name="nueva" type="password" minlength="6" required></div><div><label>Confirmar nueva contraseña</label><input name="confirm" type="password" minlength="6" required></div><div class="wide form-actions"><button class="btn primary" type="submit">Actualizar contraseña</button></div></form></div></section></main></div></body></html>
