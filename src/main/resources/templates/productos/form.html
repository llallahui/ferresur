<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='productos',stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1 th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}">Nuevo Producto</h1><p>Completa la información del producto.</p></div><a class="btn ghost" th:href="@{/productos}">← Volver</a></div><div class="form-card"><form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="grid-form"><input type="hidden" th:field="*{id}"><div><label>Código</label><input th:field="*{codigo}" required placeholder="FER-013"><div class="field-error" th:errors="*{codigo}"></div></div><div><label>Nombre</label><input th:field="*{nombre}" required placeholder="Nombre del producto"><div class="field-error" th:errors="*{nombre}"></div></div><div class="wide"><label>Descripción</label><textarea th:field="*{descripcion}" placeholder="Descripción breve"></textarea></div><div><label>Categoría</label><select th:field="*{categoriaId}" required><option value="">Seleccionar categoría</option><option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}">Herramientas</option></select><div class="field-error" th:errors="*{categoriaId}"></div></div><div><label>Precio de venta (S/)</label><input type="number" step="0.01" min="0.01" th:field="*{precio}" required><div class="field-error" th:errors="*{precio}"></div></div><div><label>Costo de compra (S/)</label><input type="number" step="0.01" min="0" th:field="*{costo}" required><div class="field-error" th:errors="*{costo}"></div><small class="help">Se usa para estimar utilidad.</small></div><div><label>Stock actual</label><input type="number" min="0" th:field="*{stock}" required><div class="field-error" th:errors="*{stock}"></div></div><div><label>Stock mínimo</label><input type="number" min="0" th:field="*{stockMinimo}" required><div class="field-error" th:errors="*{stockMinimo}"></div></div><div class="wide form-actions"><a class="btn ghost" th:href="@{/productos}">Cancelar</a><button class="btn primary" type="submit">Guardar Producto</button></div></form></div></section></main></div><script th:src="@{/js/app.js}"></script></body></html>
