<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venta · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='ventas',stockBajoCount=0"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=0"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1 th:text="'Venta #'+${venta.numero}">Venta</h1><p th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}+' · '+${venta.vendedor.nombreCompleto}">Fecha</p></div><div class="head-actions"><a class="btn primary" target="_blank" th:href="@{/ventas/{id}/boleta(id=${venta.id})}">🖨 Imprimir boleta</a><a class="btn ghost" th:href="@{/ventas}">← Volver</a></div></div><div class="invoice-card"><div class="invoice-head"><div><h2>FerreSur Ayacucho</h2><p>Comprobante de venta</p></div><strong th:text="${venta.tipoPago.name()}">EFECTIVO</strong></div><div class="table-card inner"><table><thead><tr><th>PRODUCTO</th><th>CANT.</th><th>P. UNIT.</th><th>SUBTOTAL</th></tr></thead><tbody><tr th:each="d:${venta.detalles}"><td th:text="${d.producto.nombre}">Producto</td><td th:text="${d.cantidad}">1</td><td th:text="'S/ '+${#numbers.formatDecimal(d.precioUnitario,1,2)}">S/ 0.00</td><td th:text="'S/ '+${#numbers.formatDecimal(d.subtotal,1,2)}">S/ 0.00</td></tr></tbody></table></div><div class="invoice-total"><span>Total</span><strong th:text="'S/ '+${#numbers.formatDecimal(venta.total,1,2)}">S/ 0.00</strong></div><div class="payment-summary"><span>Cliente: <b th:text="${venta.cliente!=null?venta.cliente.nombre:'Cliente general'}">General</b></span><span th:if="${venta.tipoPago.name()=='EFECTIVO'}">Pagó: <b th:text="'S/ '+${#numbers.formatDecimal(venta.montoRecibido,1,2)}">S/ 0.00</b> · Vuelto: <b th:text="'S/ '+${#numbers.formatDecimal(venta.vuelto,1,2)}">S/ 0.00</b></span><span th:if="${venta.tipoPago.name()=='CREDITO'}">Saldo pendiente: <b th:text="'S/ '+${#numbers.formatDecimal(venta.saldoPendiente,1,2)}">S/ 0.00</b></span></div></div></section></main></div></body></html>
