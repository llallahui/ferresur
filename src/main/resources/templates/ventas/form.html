<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva Venta · FerreSur</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app"><div th:with="active='ventas',stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: sidebar}"></div></div><main class="main"><div th:with="stockBajoCount=${stockBajoCount}"><div th:replace="~{fragments/header :: topbar}"></div></div><section class="content"><div class="page-head"><div><h1>Nueva Venta</h1><p>Productos, cliente y forma de pago.</p></div><a class="btn ghost" th:href="@{/ventas}">← Volver</a></div><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="sale-layout"><div class="panel"><div class="panel-head"><h3>Productos disponibles</h3><span class="muted-note" th:text="${productos.size()}+' disponibles'">0</span></div><input id="productSearch" class="filter-input" placeholder="Buscar producto por nombre o código..."><div id="productList" class="product-picker"><button type="button" class="pick-product" th:each="p:${productos}" th:data-id="${p.id}" th:data-name="${p.nombre}" th:data-code="${p.codigo}" th:data-price="${p.precio}" th:data-stock="${p.stock}"><span><b th:text="${p.nombre}">Producto</b><small th:text="${p.codigo+' · Stock '+p.stock}">FER · Stock</small></span><strong th:text="'S/ '+${#numbers.formatDecimal(p.precio,1,2)}">S/ 0.00</strong></button></div><div class="empty" th:if="${#lists.isEmpty(productos)}">No hay productos disponibles. Registra productos desde el módulo Productos.</div></div><div class="panel cart-panel"><div class="panel-head"><h3>Detalle de venta</h3><button type="button" class="text-btn" id="clearCart">Vaciar</button></div><div id="cartEmpty" class="empty">Agrega productos desde la lista.</div><div id="cart"></div><div class="cart-total"><span>Total</span><b id="cartTotal">S/ 0.00</b></div><form id="saleForm" th:action="@{/ventas/guardar}" method="post"><input type="hidden" name="itemsJson" id="itemsJson"><div class="grid-form sale-fields"><div><label>Cliente</label><select name="clienteId" id="clienteId"><option value="">Cliente general</option><option th:each="c:${clientes}" th:value="${c.id}" th:text="${c.nombre}">Cliente</option></select></div><div><label>Tipo de pago</label><select name="tipoPago" id="tipoPago"><option value="EFECTIVO">Efectivo</option><option value="YAPE">Yape</option><option value="TARJETA">Tarjeta</option><option value="CREDITO">Crédito</option></select></div><div id="cashFields"><label>¿Con cuánto paga? (S/)</label><input type="number" step="0.01" min="0" name="montoRecibido" id="montoRecibido" value="0"></div><div id="changeBox"><label>Vuelto</label><div class="readonly-value" id="vuelto">S/ 0.00</div></div><div id="creditFields" class="wide" style="display:none"><label>Fecha de vencimiento del crédito</label><input type="date" name="vencimiento" th:value="${hoy.plusDays(30)}"></div></div><button class="btn primary full" type="submit">Registrar Venta</button></form></div></div></section></main></div><script th:src="@{/js/app.js}"></script></body></html>
