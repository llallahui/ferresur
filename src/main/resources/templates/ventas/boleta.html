<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boleta #<span th:text="${venta.numero}">0001</span></title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="print-page"><div class="receipt"><div class="receipt-head"><h1>FERRESUR</h1><p>Ferretería FerreSur Ayacucho</p><p>Boleta interna #<b th:text="${venta.numero}">0001</b></p></div><p th:text="${#temporals.format(venta.fecha,'dd/MM/yyyy HH:mm')}">30/09/2026</p><p>Cliente: <b th:text="${venta.cliente!=null?venta.cliente.nombre:'Cliente general'}">General</b></p><table><tr><th>Producto</th><th>Cant.</th><th>Total</th></tr><tr th:each="d:${venta.detalles}"><td th:text="${d.producto.nombre}">Producto</td><td th:text="${d.cantidad}">1</td><td th:text="'S/ '+${#numbers.formatDecimal(d.subtotal,1,2)}">S/ 0.00</td></tr></table><h2 th:text="'TOTAL S/ '+${#numbers.formatDecimal(venta.total,1,2)}">TOTAL S/ 0.00</h2><p>Pago: <b th:text="${venta.tipoPago.name()}">EFECTIVO</b></p><p th:if="${venta.tipoPago.name()=='EFECTIVO'}" th:text="'Pagó S/ '+${#numbers.formatDecimal(venta.montoRecibido,1,2)}+' · Vuelto S/ '+${#numbers.formatDecimal(venta.vuelto,1,2)}">Pago</p><p th:if="${venta.tipoPago.name()=='CREDITO'}" th:text="'Saldo pendiente S/ '+${#numbers.formatDecimal(venta.saldoPendiente,1,2)}">Crédito</p><button class="btn primary no-print" onclick="window.print()">🖨 Imprimir</button></div></body></html>
